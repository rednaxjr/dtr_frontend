
<!-- Header -->
<div class="border-b dark:border-gray-600   w-full py-4"
    [ngClass]="{ 
        'bg-green-600 text-white':data.type=='add',
        'bg-blue-600':data.type=='update',
        'bg-red-600':data.type =='delete',

    }">
    <div class="h-full w-full flex justify-end items-center">
        <!-- <div class="flex justify-center items-center w-full">
            <p class="text-white text-2xl text-center">{{data.title}} Time</p>
        </div> -->
        <div>
            <button (click)="closeDialog()"
                class="mr-4 text-white flex justify-end">
                <mat-icon>close</mat-icon>
            </button>
        </div>
    </div>
</div>
<!-- Body content goes here -->
<div class=" flex w-full px-4 h-full py-6">
    <div class="flex h-24 w-full items-center justify-center  text-center text-xl">
        {{data.msg}}
    </div>
</div>
<div class="h-16  w-full border-t flexx items-center">
    <div class="flex h-full w-full justify-between px-2 items-center">
        <button class="px-4 py-2 bg-red-600 text-white rounded-10"
            (click)="closeDialog()">Cancel</button>
        <button class="px-4 py-2 bg-green-600 text-white rounded-10"
            (click)="confirm()">Confirm</button>
    </div>
</div>
