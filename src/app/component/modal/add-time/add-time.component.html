
<!-- Header -->
<div class="border-b dark:border-gray-600 bg-green-700 w-full py-4">
  <div class="h-full w-full flex justify-between items-center">
    <!-- This empty div takes up space on the left -->
    <div class="flex-1"></div> 
    <!-- Centered text -->
    <div class="flex justify-center items-center w-full">
      <p class="text-white text-2xl text-center">{{data.title}} Time</p>
    </div> 
    <!-- Close button -->
    <div>
      <button (click)="closeDialog()" class="mr-4 text-white flex justify-end">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  </div>
</div> 
<!-- Body content goes here -->
<div class="px-4 h-full py-6">
  <div class="flex items-center h-full">
    <label for="time" class="w-auto"> Time:</label>
    <div class="relative ml-2">
      <input type="time" class="border w-full" name="time" [(ngModel)]="time" [value]="time" >
    </div>
  </div>  
  <div class="flex items-center h-full mt-2">
    <label  for="date"   class="w-auto">Date</label> 
    <div class="relative ml-2">
      <select id="date" class="border " [(ngModel)]="date" [disabled]="data.date.length == 1">
        <option *ngFor="let date of data.date" [value]="date">{{ date }}</option>
      </select>
    </div>
  </div>
 

</div>
<div class="h-16  w-full border-t flexx items-center">
  <div class="flex h-full w-full justify-between px-2 items-center">
    <button class="px-4 py-2 bg-red-600 text-white rounded-10"  (click)="closeDialog()">Cancel</button>
    <button class="px-4 py-2 bg-green-600 text-white rounded-10" (click)="submit()">Submit</button>
  </div>
</div>
